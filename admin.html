<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Shop Web</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section id="adminLogin" class="admin-login">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password" />
    <button id="adminLoginBtn">Enter</button>
    <div id="adminError" class="error"></div>
  </section>

  <section id="adminPanel" class="admin-panel hidden">
    <h2>Admin Dashboard</h2>
    <nav class="admin-nav">
      <button data-section="products">Products</button>
      <button data-section="theme">Theme</button>
      <button data-section="offers">Offers</button>
      <button data-section="orders">Orders</button>
    </nav>

    <div id="adminContent"></div>
  </section>

  <script src="js/admin.js"></script>
</body>
</html>
