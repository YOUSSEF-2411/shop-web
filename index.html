<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Web</title>
  <link rel="stylesheet" href="css/style.css" />
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_Z29yZ2VvdXMtdGVycmllci03MC5jbGVyay5hY2NvdW50cy5kZXYk" src="https://gorgeous-terrier-70.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js" type="text/javascript"></script>
</head>
<body>
  <header class="header">
    <div class="logo">Shop Web</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html">Checkout</a>
      <a href="admin.html">Admin</a>
    </nav>
    <div class="header-actions">
      <input type="text" id="searchInput" placeholder="Search products..." />
      <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
      <div id="userProfile"></div>
      <button id="themeToggle">🌓</button>
    </div>
  </header>

  <section class="hero">
    <h1>Welcome to Shop Web</h1>
    <p>Your one-stop shop for great products.</p>
  </section>

  <section class="carousel" id="offerCarousel">
    <div class="carousel-inner">
      <div class="carousel-item active">Big Summer Sale!</div>
      <div class="carousel-item">Buy 2 get 1 free!</div>
      <div class="carousel-item">Free shipping over $50!</div>
    </div>
    <button class="carousel-control prev" data-direction="-1">&#10094;</button>
    <button class="carousel-control next" data-direction="1">&#10095;</button>
  </section>

  <section class="featured">
    <h2>Featured Products</h2>
    <div id="featuredProducts" class="product-grid"></div>
  </section>

  <div id="cartDrawer" class="cart-drawer hidden">
    <h3>Shopping Cart</h3>
    <div id="cartItems"></div>
    <div class="cart-total">Total: $<span id="cartTotal">0.00</span></div>
    <a href="checkout.html" class="btn">Checkout</a>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
